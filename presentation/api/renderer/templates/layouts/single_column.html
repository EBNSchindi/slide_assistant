{% extends "base.html" %}

{% block layout %}
<div class="layout-single-column">
  <div class="layout-header">
    <h1 class="slide-title">{{ title }}</h1>
    {% if subtitle %}
    <h2 class="slide-subtitle">{{ subtitle }}</h2>
    {% endif %}
  </div>

  <div class="layout-content">
    {% for component in components %}
    <div class="component-wrapper">
      {{ component | safe }}
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
